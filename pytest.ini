[pytest]
testpaths = tests
filterwarnings =
    # PyGObject selbst nutzt die in Python 3.14 veralteten asyncio-Policy-Funktionen
    ignore:.*asyncio.*policy.*:DeprecationWarning
    ignore:.*AbstractEventLoopPolicy.*:DeprecationWarning
markers =
    integration: startet nothing-wm headless (braucht wlroots-Build und dbus-run-session)
